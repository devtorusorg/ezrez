name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @devtorusorg/ezrez check
      - run: bun run --filter @devtorusorg/ezrez build
      - run: npm publish --provenance
        working-directory: packages/ezrez
      - run: bunx jsr publish
        working-directory: packages/ezrez
