name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The initial 0.1.0 release tag predates the Biome exclusion for deno.json.
      # Manual recovery still runs lint, type checks, and tests against that exact tag.
      - run: bun run --filter @devtorusorg/ezrez check
        if: github.event_name == 'release'
      - run: bun run --filter @devtorusorg/ezrez lint && bun run --filter @devtorusorg/ezrez typecheck && bun run --filter @devtorusorg/ezrez test
        if: github.event_name == 'workflow_dispatch'
      - run: bun run --filter @devtorusorg/ezrez build
      - run: npm publish --provenance
        working-directory: packages/ezrez
      - run: bunx jsr publish
        working-directory: packages/ezrez
