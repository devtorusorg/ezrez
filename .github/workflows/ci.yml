name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run --filter ezrez pack:check
      - run: bun run --filter ezrez test:consumers
      - run: bun run --filter ezrez test:tree-shaking
      - run: bun run --filter ezrez jsr:check
