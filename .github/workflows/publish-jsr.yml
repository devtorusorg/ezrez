name: Publish JSR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Approved release tag to publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @devtorusorg/ezrez check
      - run: bun run --filter @devtorusorg/ezrez build
      - run: bunx jsr publish
        working-directory: packages/ezrez
